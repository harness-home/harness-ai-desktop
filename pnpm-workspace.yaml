# Single-package repo: this file exists for pnpm catalogs and build-script allowlist only.
#
# Version pinning policy (workspace ledger #7 / AGENTS red line #2):
# every dsh package is referenced as `catalog:dsh` in package.json, so an
# upstream upgrade is a one-line change here — never edit versions in place.
catalogs:
  dsh:
    "@deepseek-ai/dsh-app-boot": 0.1.1-rc.2
  cordis:
    "@deepseek-ai/cordis": 4.0.1
    "@deepseek-ai/cordis-plugin-group": 1.0.1
    "@deepseek-ai/cordis-plugin-include": 1.0.6
    "@deepseek-ai/cordis-plugin-loader": 1.0.2
    "@deepseek-ai/cordis-plugin-timer": 1.1.3

# Dependencies allowed to run install-time build scripts; everything else is blocked.
# Note: electron >= 43 has no postinstall of its own — its binary is fetched by
# the `install-electron` bin wired into this project's postinstall script.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-app-boot@0.1.1-rc.2'
  - '@deepseek-ai/dsh-attachment@0.1.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.1.1-rc.2'
  - '@deepseek-ai/dsh-home-paths@0.1.1-rc.2'
  - '@deepseek-ai/dsh-invariants@0.1.1-rc.2'
  - '@deepseek-ai/dsh-launch-environment@0.1.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.1.1-rc.2'
  - '@deepseek-ai/dsh-scope@0.1.1-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.1.1-rc.2'
  - '@deepseek-ai/dsh-timeout@0.1.1-rc.2'

