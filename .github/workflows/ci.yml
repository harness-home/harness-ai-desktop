# Verification for every change: typecheck, unit tests, production build.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved to point at
# different code, and this repository asks the same of the plugins it installs.
# To update one, resolve the tag with
#   gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'
# and change the SHA together with the version in the trailing comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The repository .npmrc routes binary downloads through a CN mirror, because
  # GitHub Releases is unreachable from the maintainer's network. On a GitHub
  # runner the opposite holds, so take the upstream sources back here.
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  verify:
    # Windows is the packaged target, and the only host that exercises the
    # PowerShell sandbox runner. Verify where the product actually ships.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No version here on purpose: it comes from `packageManager` in
        # package.json, so the lockfile and the CI runner can never disagree.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x # engines: ^22.19.0 || >=24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
