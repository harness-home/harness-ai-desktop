# Packaging (Win x64 first). asar is ON: installing writes 105 files instead of
# 12,371, which took the install from 210 s to 12 s on the test machine — the
# same bytes on disk, because install cost is per file, not per megabyte (see
# AGENTS.md, the install cost model).
#
# It was off before, on the belief that the dsh runtime needs real node_modules
# paths. Two thirds of that belief were wrong, and the remaining third was right
# in a way nobody had named:
#   - ESM imports load from the archive on Electron 43;
#   - native modules load because asarUnpack keeps them on disk;
#   - CommonJS resolution *from the profile* does not, and that is the real
#     hazard. dsh reads package metadata with createRequire() against the
#     composed tree's base — the profile directory — and reaches the in-box
#     packages only through the symlink farm dsh-app-boot builds in
#     <dsh home>/profiles/node_modules. Those are OS symlinks, and an OS cannot
#     walk into a file, so with asar on every one of them dangles. The caller
#     that matters treats the failure as "not a client package" and caches it,
#     which composed the entire web UI to nothing without logging one error.
#     src/main/harness/module-resolution.ts answers from the installation
#     instead. scripts/smoke-packaged.mjs is what catches a regression here: the
#     app still boots, still serves and still reports every fiber without it.
appId: ai.harness.desktop
productName: Harness AI
asar: true
# Anything the OS opens rather than Node: native addons go through dlopen, and
# rg.exe / OpenConsole.exe / fastlist are spawned as processes. verify-packaged
# asserts each is a real file, because the archive header lists an unpacked
# entry exactly like a packed one.
asarUnpack: '**/*.{node,exe,dll}'
# Native deps (node-pty, koffi) ship N-API prebuilds that already load inside
# Electron (proven by the dev shell); a node-gyp rebuild would only demand a
# local Visual Studio for nothing.
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
  - THIRD_PARTY_NOTICES.md
  # Install time is paid per file, not per megabyte: measured on this machine,
  # 19,688 files take ~299 s to install, and removing 45 MB spread over 53 files
  # changed nothing. Source maps and type declarations are a third of the file
  # count and are never loaded by a running client — no resolver looks for them,
  # only a debugger and a compiler do, and neither is present in a packaged app.
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.d.mts'
  - '!**/*.d.cts'
# Chromium ships one .pak per language: 55 files, 46 MB. This product ships two
# UI languages (zh-CN and en-US, workspace ledger #11) and Chromium falls back
# to en-US for every other locale, so the remaining 53 are payload the installer
# writes and nothing ever reads.
electronLanguages:
  - zh-CN
  - en-US
# Post-install configuration. Deliberately outside resources/app, beside the
# executable, because the point of it is that someone can find and edit it on a
# machine that is already installed — a network that cannot reach the default
# npm registry is not a reason to rebuild the client. Read by
# src/main/runtime-config.ts; an update overwrites it with these defaults.
extraFiles:
  - from: config/harness-ai.config.json
    to: harness-ai.config.json
afterPack: ./scripts/verify-packaged.cjs
# Update feed. This block is what makes electron-builder write app-update.yml
# into the packaged resources and emit latest.yml beside the installer, which
# together are the update manifest electron-updater reads.
#
# It points at the GitHub releases the release workflow already publishes —
# installer, blockmap and latest.yml are attached to every `v*` tag — so the
# distribution location is now a fact rather than a decision (ledger #31/#14).
# Note that every 0.x release is published as a pre-release, which
# electron-updater skips by default; src/main/updater.ts opts a preview build
# into them deliberately rather than leaving the client checking forever and
# finding nothing.
#
# HARNESS_UPDATE_FEED_URL still overrides this at runtime with a generic feed,
# which is how the update path is tested and how a private deployment runs.
publish:
  - provider: github
    owner: harness-home
    repo: harness-ai-desktop
# Custom URL scheme: the public website hands a plugin catalog id to the
# installed client with `harness-ai://install?listing=<id>`. The app also claims
# the scheme at runtime, so a portable/unpacked run still works.
protocols:
  - name: Harness AI
    schemes:
      - harness-ai
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: HarnessAI-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harness AI
