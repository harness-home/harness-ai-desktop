# Tag -> installer. Pushing a `v<version>` tag builds the Windows installer and
# publishes it on a GitHub Release.
#
#   git tag v0.1.5 && git push origin v0.1.5
#
# The tag must match the version in package.json; a mismatch fails the job
# before anything is built, because a release named after a version it does not
# contain is worse than no release.
#
# Actions are pinned to commit SHAs — see the note in ci.yml for how to update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both gates run before anything is built: a release named after a version
      # it does not contain, or shipped with no word on what changed, is worse
      # than no release — and finding that out after a ten-minute package step
      # wastes the run.
      - name: Check the tag and the changelog
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          echo "package.json=$version tag=$tag"
          if [ "$tag" != "v$version" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

          # Everything between this version's heading and the next one. Matched
          # with index() rather than a regex: the heading contains [ and ], and
          # a single lost backslash turns "[0.1.5]" into a character class that
          # silently matches nothing — an empty changelog, not an error.
          section="$RUNNER_TEMP/changelog-section.md"
          awk -v want="## [$version]" '
            index($0, want) == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            # Skip link-reference definitions: they belong to the file, and in
            # release notes they render as nothing at all.
            inside && index($0, "[") == 1 && index($0, "]: ") > 0 { next }
            inside { print }
          ' CHANGELOG.md > "$section"
          # Drop the blank lines the split leaves at both ends.
          sed -i -e '/./,$!d' "$section"
          while [ -s "$section" ] && [ -z "$(tail -n 1 "$section")" ]; do
            sed -i -e '$d' "$section"
          done

          if [ ! -s "$section" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "changelog section: $(wc -l < "$section") lines"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "section=$section" >> "$GITHUB_OUTPUT"

      # A release is a promise. Ship only what passes the same gate as main.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Package
        run: pnpm dist:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-ai-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=$(mktemp)
          {
            echo "**Harness AI for Windows x64** — the desktop client hosts the DeepSeek Harness"
            echo "runtime in-process, on loopback."
            echo
            echo "## What changed"
            echo
            cat "${{ steps.version.outputs.section }}"
            echo
            echo "[Full commit log](https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}) · [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
            echo
            echo "## Install"
            echo
            echo "Download \`HarnessAI-${version}-x64-Setup.exe\` and run it."
            echo
            echo "> [!IMPORTANT]"
            echo "> **This installer is not code-signed.** Windows SmartScreen will warn on first run."
            echo "> Verify the SHA-256 below before installing — in PowerShell:"
            echo "> \`Get-FileHash .\\HarnessAI-${version}-x64-Setup.exe -Algorithm SHA256\`"
            echo
            echo '```'
            ( cd dist && sha256sum *.exe ) || ( cd dist && certutil -hashfile *.exe SHA256 )
            echo '```'
            echo
            echo "\`latest.yml\` and the blockmap are attached for the in-app updater; you do not"
            echo "need to download them by hand."
          } > "$notes"

          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac

          gh release create "$GITHUB_REF_NAME" \
            --title "Harness AI $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            $prerelease \
            dist/*.exe dist/*.blockmap dist/latest.yml
