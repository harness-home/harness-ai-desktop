# Packaging (Win x64 first). asar is off because the dsh runtime resolves its
# plugin closure through real node_modules paths — ESM imports, the profile
# symlink farm, native modules.
#
# Measured 2026-08-25, and the assumption behind that decision did not survive:
# a spike build with asar on (`-c.asar=true -c.asarUnpack="**/*.{node,exe,dll}"`)
# booted from a real installation, all 156 fibers, and installs in 12 s against
# 210 s for this configuration — same bytes on disk, 105 files instead of 12,371.
# ESM does load from asar on Electron 43. Before it can be turned on here:
# verify-packaged.cjs has to read the archive's manifest instead of stat()ing
# paths (that gate exists because of a real escape, and asar would silently
# retire it), a market install has to be proven to work with pnpm inside the
# archive, and a real session has to exercise node-pty, ripgrep and sharp from
# app.asar.unpacked. See AGENTS.md, "安装耗时的成本模型".
appId: ai.harness.desktop
productName: Harness AI
asar: false
# Native deps (node-pty, koffi) ship N-API prebuilds that already load inside
# Electron (proven by the dev shell); a node-gyp rebuild would only demand a
# local Visual Studio for nothing.
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
  - THIRD_PARTY_NOTICES.md
  # Install time is paid per file, not per megabyte: measured on this machine,
  # 19,688 files take ~299 s to install, and removing 45 MB spread over 53 files
  # changed nothing. Source maps and type declarations are a third of the file
  # count and are never loaded by a running client — no resolver looks for them,
  # only a debugger and a compiler do, and neither is present in a packaged app.
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.d.mts'
  - '!**/*.d.cts'
# Chromium ships one .pak per language: 55 files, 46 MB. This product ships two
# UI languages (zh-CN and en-US, workspace ledger #11) and Chromium falls back
# to en-US for every other locale, so the remaining 53 are payload the installer
# writes and nothing ever reads.
electronLanguages:
  - zh-CN
  - en-US
# Post-install configuration. Deliberately outside resources/app, beside the
# executable, because the point of it is that someone can find and edit it on a
# machine that is already installed — a network that cannot reach the default
# npm registry is not a reason to rebuild the client. Read by
# src/main/runtime-config.ts; an update overwrites it with these defaults.
extraFiles:
  - from: config/harness-ai.config.json
    to: harness-ai.config.json
afterPack: ./scripts/verify-packaged.cjs
# Update feed. This block is what makes electron-builder write app-update.yml
# into the packaged resources and emit latest.yml beside the installer, which
# together are the update manifest electron-updater reads. The host below is a
# sentinel until the distribution location is decided (workspace ledger #31);
# a deployment or a test can point the client elsewhere at runtime with
# HARNESS_UPDATE_FEED_URL, without rebuilding.
publish:
  - provider: generic
    # Sentinel host until the distribution location is decided (ledger #31);
    # .invalid can never resolve, so no client ever fetches it.
    url: https://updates.invalid/desktop/win-x64
    channel: latest
# Custom URL scheme: the public website hands a plugin catalog id to the
# installed client with `harness-ai://install?listing=<id>`. The app also claims
# the scheme at runtime, so a portable/unpacked run still works.
protocols:
  - name: Harness AI
    schemes:
      - harness-ai
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: HarnessAI-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harness AI
