# Packaging (Win x64 first). asar is off: the dsh runtime resolves its plugin
# closure through real node_modules paths (ESM imports, the profile symlink
# farm, native modules), which an asar archive cannot provide. Revisit asar
# precision together with auto-update (workspace ledger #14).
appId: ai.harness.desktop
productName: Harness AI
asar: false
# Native deps (node-pty, koffi) ship N-API prebuilds that already load inside
# Electron (proven by the dev shell); a node-gyp rebuild would only demand a
# local Visual Studio for nothing.
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
  - THIRD_PARTY_NOTICES.md
afterPack: ./scripts/verify-packaged.cjs
# Custom URL scheme: the public website hands a plugin catalog id to the
# installed client with `harness-ai://install?listing=<id>`. The app also claims
# the scheme at runtime, so a portable/unpacked run still works.
protocols:
  - name: Harness AI
    schemes:
      - harness-ai
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: HarnessAI-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harness AI
